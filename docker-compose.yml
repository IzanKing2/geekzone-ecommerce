services:
  # ——————————————————————————————————————————————————————————————————————
  # SERVICIO 1: app (PHP-FPM + Laravel)
  # ——————————————————————————————————————————————————————————————————————
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: geekzone_app
    restart: unless-stopped
    volumes:
      - ./geekzone:/var/www/html
    networks:
      - geekzone_network
    depends_on:
      - db
  
  # ——————————————————————————————————————————————————————————————————————
  # SERVICIO 2: webserver (Nginx)
  # ——————————————————————————————————————————————————————————————————————
  webserver:
    image: nginx:alpine
    container_name: geekzone_webserver
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./geekzone:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - geekzone_network
    depends_on:
      - app
  
  # ——————————————————————————————————————————————————————————————————————
  # SERVICIO 3: db (MySQL 8.0)
  # ——————————————————————————————————————————————————————————————————————
  db:
    image: mysql:8.0
    container_name: geekzone_db
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: geekzone
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: geekzone_user
      MYSQL_PASSWORD: geekzone_pass
    volumes:
      - geekzone-db-data:/var/lib/mysql
    networks:
      - geekzone_network
  
  # ——————————————————————————————————————————————————————————————————————
  # SERVICIO 4: phpMyAdmin (Gestor visual de BD)
  # ——————————————————————————————————————————————————————————————————————
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: geekzone_phpmyadmin
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: root
    networks:
      - geekzone_network
    depends_on:
      - db

# ——————————————————————————————————————————————————————————————————————
# REDES
# ——————————————————————————————————————————————————————————————————————
networks:
  geekzone_network:
    driver: bridge

# ——————————————————————————————————————————————————————————————————————
# VOLUMES
# ——————————————————————————————————————————————————————————————————————
volumes:
  geekzone-db-data:
    driver: local