; OPcache y caché de rutas de PHP-FPM.
;
; DESARROLLO (por defecto): validate_timestamps=1 y revalidate_freq=60. Con el valor por defecto
; de PHP (2 s), cada pausa de más de 2 s entre peticiones obliga a hacer stat() de cientos de
; ficheros del proyecto; sobre el volumen montado de Docker (Windows/macOS) eso cuesta ~1-3 s por
; petición. Con 60 s un cambio en un .php tarda como máximo un minuto en verse; para verlo al
; instante: `docker-compose exec app sh -c 'kill -USR2 1'` (recarga PHP-FPM) o PHP_OPCACHE_REVALIDATE_FREQ=0.
; Los tests (`php artisan test`) corren por CLI y no usan esta caché.
;
; PRODUCCIÓN: PHP_OPCACHE_VALIDATE_TIMESTAMPS=0 (no se vuelve a comprobar el disco; se despliega
; una imagen nueva o se recarga PHP-FPM en cada despliegue).

opcache.enable=1
opcache.memory_consumption=256
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
opcache.validate_timestamps=${PHP_OPCACHE_VALIDATE_TIMESTAMPS:-1}
opcache.revalidate_freq=${PHP_OPCACHE_REVALIDATE_FREQ:-60}

; Caché de resolución de rutas: menos llamadas al sistema de ficheros
realpath_cache_size=4096K
realpath_cache_ttl=600
