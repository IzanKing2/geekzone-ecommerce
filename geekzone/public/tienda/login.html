<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Geekzone</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/login.css">
</head>

<body>
    <div class="login-container">
        <header class="login-header">
            <h2>INICIAR SESIÓN</h2>
            <p>Por favor, introduzca su correo electrónico y contraseña:</p>
        </header>

        <form action="#" method="POST">
            <div class="form-group">
                <input type="email" id="email" class="form-control" placeholder=" " required>
                <label for="email" class="form-label">Correo electrónico</label>
            </div>

            <div class="form-group">
                <input type="password" id="password" class="form-control" placeholder=" " required>
                <label for="password" class="form-label">Contraseña</label>
            </div>

            <div class="form-group" style="display: flex; justify-content: space-between; font-size: 0.9rem;">
                <label>
                    <input type="checkbox"> Recordarme
                </label>
                <a class="login-footer-link">¿Olvidaste tu contraseña?</a>
            </div>

            <button type="submit" class="btn-login">Iniciar sesión</button>
        </form>

        <footer class="login-footer">
            <p>¿No tienes una cuenta? <a href="register.html">Regístrate aquí</a></p>
        </footer>
    </div>
</body>

</html>
