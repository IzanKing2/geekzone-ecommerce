<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrarse - Geekzone</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/register.css">
</head>

<body>
    <div class="register-container">
        <header class="register-header">
            <h2>REGISTRARSE</h2>
            <p>Por favor, rellene los siguientes campos:</p>
        </header>

        <form action="#" method="POST">
            <div class="form-group">
                <input type="text" id="nombre" class="form-control" placeholder=" " required>
                <label for="nombre" class="form-label">Nombre</label>
            </div>

            <div class="form-group">
                <input type="text" id="apellido" class="form-control" placeholder=" " required>
                <label for="apellido" class="form-label">Apellido</label>
            </div>

            <div class="form-group">
                <input type="email" id="email" class="form-control" placeholder=" " required>
                <label for="email" class="form-label">Correo eléctronico</label>
            </div>

            <div class="form-group">
                <input type="password" id="password" class="form-control" placeholder=" " required>
                <label for="password" class="form-label">Contraseña</label>
            </div>

            <div class="form-group" style="display: flex; justify-content: space-between; font-size: 0.9rem;">
                <label>
                    <input type="checkbox"> Aceptar términos y condiciones
                </label>
            </div>

            <button type="submit" class="btn-register">Registrarse</button>
        </form>

        <footer class="register-footer">
            <p>¿Ya tienes una cuenta? <a href="login.html">Iniciar sesión</a></p>
        </footer>
    </div>
</body>

</html>
