info:
  name: store
  type: http
  seq: 2

http:
  method: POST
  url: http://localhost:8080/api/categorias
  headers:
    - name: Authorization
      value: Bearer {{token}}
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "Gaming",
        "description": "Videojuegos y tarjetas de compra. Experimenta, disfruta, juega!",
        "image_url": "img/categories/gaming.jpg"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
