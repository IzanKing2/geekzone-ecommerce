info:
  name: store
  type: http
  seq: 2

http:
  method: POST
  url: http://localhost:8080/api/productos
  headers:
    - name: Authorization
      value: Bearer {{token}}
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "Marvel's Spider-Man 2 Figura",
        "description": "Figura de colección del videojuego de Imsomniac Games Marvel's Spider-Man 2 con Venom y Miles Morales",
        "price": 146.68,
        "stock": 6,
        "image_url": "img/products/spiderman2.jpg",
        "category_id": 1
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
