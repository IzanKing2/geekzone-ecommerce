server {
    listen 80;
    
    server_name localhost;

    index index.html index.php;
    root /var/www/html/public;

    client_max_body_size 20M; # Tamaño máximo de los archivos subidos

    server_tokens off;

    # Cabeceras de seguridad básicas
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ——————————————————————————————————————————————————————————————————————
    # Las subidas (storage) son solo contenido estático: nunca se ejecuta PHP ahí
    # ——————————————————————————————————————————————————————————————————————
    location ^~ /storage/ {
        # Ni ejecutar ni mostrar scripts: cualquier .php aquí es un 404
        location ~* \.php$ {
            return 404;
        }

        try_files $uri =404;
    }

    # ——————————————————————————————————————————————————————————————————————
    # Gestionamos las peticiones HTTP
    # ——————————————————————————————————————————————————————————————————————
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ——————————————————————————————————————————————————————————————————————
    # Gestionamos las peticiones PHP
    # ——————————————————————————————————————————————————————————————————————
    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # ——————————————————————————————————————————————————————————————————————
    # Bloqueamos el acceso a los archivos ocultos
    # ——————————————————————————————————————————————————————————————————————
    location ~ /\.(?!well-known).* {
        deny all;
    }
}